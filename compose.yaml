services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: macromate
      POSTGRES_PASSWORD: macromate
      POSTGRES_DB: macromate
    ports:
      - "5491:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macromate"]
      interval: 2s
      retries: 30

volumes:
  db-data:
