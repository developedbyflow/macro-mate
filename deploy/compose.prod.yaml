services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: macromate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?setează POSTGRES_PASSWORD în .env}
      POSTGRES_DB: macromate
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macromate"]
      interval: 5s
      retries: 30

  api:
    build: ../api
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: Host=db;Database=macromate;Username=macromate;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      DeepSeek__ApiKey: ${DEEPSEEK_API_KEY:-}
      Email__PublicUrl: https://${DOMAIN}
      Email__From: ${EMAIL_FROM:-}
      Email__ResendApiKey: ${RESEND_API_KEY:-}
      OpenFoodFacts__UserAgent: MacroMate/1.0 (${DOMAIN})
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?setează DOMAIN în .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  app-data:
  caddy-data:
  caddy-config:
